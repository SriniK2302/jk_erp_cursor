{% load i18n %}
<style>
  .tm-picker .tm-results {
    max-height: 16rem;
    overflow: auto;
    border: 1px solid #444;
    padding: 0.35rem 0.5rem;
    margin: 0.35rem 0;
    border-radius: 4px;
  }
  .tm-picker .tm-row { margin: 0.2rem 0; }
  .tm-picker .tm-label { cursor: pointer; display: block; }
  .tm-picker .tm-search { width: 100%; max-width: 36rem; box-sizing: border-box; }
  .tm-picker .tm-search-help { margin: 0.25rem 0 0.35rem; }
</style>
<div
  class="tm-picker"
  id="tm_picker_{{ widget.attrs.id }}"
  data-search-url="{{ tm_search_url }}"
  data-for-user="{{ tm_for_user }}"
  data-multiple="{% if tm_is_multiple %}1{% else %}0{% endif %}"
  data-field-name="{{ widget.name }}"
  data-initial-ids="{{ tm_initial_ids }}"
  data-initial-id="{{ tm_initial_id }}"
  data-initial-label="{{ tm_initial_label }}"
  data-empty-text="{{ tm_empty_text }}"
  data-error-text="{{ tm_error_text }}"
>
  {% if tm_is_multiple %}
    <div class="tm-hidden-bucket"></div>
  {% else %}
    <input
      type="hidden"
      class="tm-hidden-single"
      name="{{ widget.name }}"
      id="{{ widget.attrs.id }}"
      {% if widget.value != None %}value="{{ widget.value|stringformat:'s' }}"{% endif %}
    >
  {% endif %}
  <input
    type="search"
    class="tm-search vTextField"
    id="{{ widget.attrs.id }}_search"
    placeholder="{{ tm_search_placeholder }}"
    autocomplete="off"
    aria-label="{{ tm_search_aria }}"
  >
  <p class="help tm-search-help">{{ tm_search_help }}</p>
  <div class="tm-results" role="list" aria-live="polite"></div>
  <p class="help">
    <button type="button" class="button tm-clear">{{ tm_clear_label }}</button>
  </p>
</div>
