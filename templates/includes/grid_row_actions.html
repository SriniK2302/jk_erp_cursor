{# Requires: list_url_name (e.g. grades), pk, delete_action, confirm_message #}
{# Optional: delete_disabled, delete_disabled_title #}
<div class="row-actions">
  {% if edit_url_name %}
    <a href="{% url edit_url_name edit_pk %}" class="icon-btn icon-btn-edit" title="Edit" aria-label="Edit">
  {% else %}
    <a href="{% url list_url_name %}?edit={{ pk }}" class="icon-btn icon-btn-edit" title="Edit" aria-label="Edit">
  {% endif %}
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
  </a>
  {% if delete_disabled %}
    <span
      class="icon-btn icon-btn-danger is-disabled"
      title="{{ delete_disabled_title|default:'Delete is not allowed for this row.' }}"
      aria-label="{{ delete_disabled_title|default:'Delete disabled' }}"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    </span>
  {% else %}
    <form method="post" class="inline-form" onsubmit="return confirm('{{ confirm_message|escapejs }}');">
      {% csrf_token %}
      <input type="hidden" name="action" value="{{ delete_action }}">
      <input type="hidden" name="pk" value="{{ pk }}">
      <button type="submit" class="icon-btn icon-btn-danger" title="Delete" aria-label="Delete">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      </button>
    </form>
  {% endif %}
</div>
