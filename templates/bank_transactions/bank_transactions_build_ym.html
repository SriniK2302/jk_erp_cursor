{% extends "base.html" %}

{% block title %}Update YM · JK ERP{% endblock %}

{% block content %}
<div class="page">
  <section class="home-frame">
    <header class="page-header">
      <h1>Update YM</h1>
      <p class="muted">Update the YM column on bank_transactions_source.</p>
    </header>

    <form method="post">
      {% csrf_token %}
      <p>
        <label>
          <input type="checkbox" name="force" value="1">
          Recalculate all rows (even if YM is already set) — use this after changing a Value Date
        </label>
      </p>
      <button type="submit" class="button">Update YM</button>
    </form>

    <p class="muted"><a href="{% url 'bank_transactions_hub' %}">← Back to Bank Transactions Source</a></p>
  </section>
</div>
{% endblock %}
