{% extends "base.html" %}

{% block title %}Process Gmails · JK ERP{% endblock %}

{% block content %}
<div class="page">
  <section class="home-frame">
    <header class="page-header">
      <h1>Process Gmails</h1>
      <p class="muted">Search emails and download matching attachments.</p>
    </header>

    <div class="utility-field-row">
      <label for="gp-account-select" class="muted utility-label">Gmail account</label>
      <div class="utility-field-row__grow">
        <select id="gp-account-select" class="utility-input">
          <option value="">— Choose an account —</option>
          {% for account in accounts %}
          <option value="{{ account.email }}" {% if account.email == initial_email %}selected{% endif %}>{{ account.email }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="utility-field-row">
      <button type="button" id="gp-move-to-inbox-btn" class="button button-compact button-secondary">Move all mails to Inbox</button>
    </div>

    <div class="utility-field-row">
      <label for="gp-label-select" class="muted utility-label">Folder / Label</label>

    <div class="utility-field-row">
      <label for="gp-label-select" class="muted utility-label">Folder / Label</label>
      <div class="utility-field-row__grow">
        <select id="gp-label-select" class="utility-input" disabled>
          <option value="">— Select an account first —</option>
        </select>
      </div>
    </div>

    <div class="utility-field-row">
      <label for="gp-scope-select" class="muted utility-label">Search in</label>
      <div class="utility-field-row__grow">
        <select id="gp-scope-select" class="utility-input">
          <option value="subject" {% if initial_scope == "subject" %}selected{% endif %}>Subject</option>
          <option value="from" {% if initial_scope == "from" %}selected{% endif %}>From</option>
          <option value="body" {% if initial_scope == "body" %}selected{% endif %}>Body</option>
        </select>
      </div>
    </div>

    <div class="utility-field-row">
      <label for="gp-keyword-input" class="muted utility-label">Keywords</label>
      <div class="utility-field-row__grow">
        <input id="gp-keyword-input" type="text" class="utility-input" placeholder="e.g. invoice+March (use + for AND)" value="{{ initial_keywords }}">
        <label><input type="checkbox" id="gp-has-attachment" {% if initial_has_attachment %}checked{% endif %}> Has attachment</label>
        <button type="button" id="gp-search-btn" class="button button-compact button-secondary">Search</button>
        <button type="button" id="gp-unique-subjects-btn" class="button button-compact button-secondary">Show unique subjects (label)</button>

      </div>
    </div>

    <div id="gp-progress-wrap" class="utility-progress-wrap" hidden>
      <div class="utility-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="gp-progress-track">
        <div id="gp-progress-bar" class="utility-progress-bar"></div>
      </div>
      <p class="muted utility-progress-text" id="gp-progress-text">Preparing search…</p>
    </div>

    <div id="gp-results-wrap" class="excel-import-match-report-wrap" hidden></div>

    <p class="muted"><a href="{% url 'gmail_processor' %}">← Back to Gmail Processor</a></p>
  </section>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  (function () {
    const accountSelect = document.getElementById("gp-account-select");
    const labelSelect = document.getElementById("gp-label-select");

    accountSelect.addEventListener("change", async function () {
      const email = accountSelect.value;
      labelSelect.innerHTML = "";
      labelSelect.disabled = true;

      if (!email) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "— Select an account first —";
        labelSelect.appendChild(opt);
        return;
      }

      const loadingOpt = document.createElement("option");
      loadingOpt.value = "";
      loadingOpt.textContent = "Loading labels…";
      labelSelect.appendChild(loadingOpt);

      try {
        const res = await fetch("{% url 'gmail_process_labels_json' %}?email=" + encodeURIComponent(email), {
          headers: { "X-Requested-With": "XMLHttpRequest" }
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          throw new Error(data.message || "Could not load labels.");
        }
        labelSelect.innerHTML = "";
        const opt0 = document.createElement("option");
        opt0.value = "";
        opt0.textContent = "— Choose a label —";
        labelSelect.appendChild(opt0);
        (data.labels || []).forEach(function (label) {
          const opt = document.createElement("option");
          opt.value = label.id;
          opt.textContent = label.name;
          labelSelect.appendChild(opt);
        });
        labelSelect.disabled = false;
      } catch (e) {
        labelSelect.innerHTML = "";
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = e.message || "Failed to load labels.";
        labelSelect.appendChild(opt);
      }
    });

    const scopeSelect = document.getElementById("gp-scope-select");
    const keywordInput = document.getElementById("gp-keyword-input");
    const hasAttachment = document.getElementById("gp-has-attachment");
    const searchBtn = document.getElementById("gp-search-btn");
    const resultsWrap = document.getElementById("gp-results-wrap");

    function escapeHtmlCell(text) {
      if (text === null || text === undefined) return "";
      const div = document.createElement("div");
      div.textContent = String(text);
      return div.innerHTML;
    }

    const progressWrap = document.getElementById("gp-progress-wrap");
    const progressBar = document.getElementById("gp-progress-bar");
    const progressTrack = document.getElementById("gp-progress-track");
    const progressText = document.getElementById("gp-progress-text");

    searchBtn.addEventListener("click", async function () {
      const email = accountSelect.value;
      if (!email) {
        alert("Choose an account first.");
        return;
      }
      const keywords = keywordInput.value.trim();
      if (!keywords) {
        alert("Enter at least one keyword.");
        return;
      }

      searchBtn.disabled = true;
      resultsWrap.hidden = true;
      resultsWrap.innerHTML = "";
      progressWrap.hidden = false;
      progressBar.style.width = "0%";
      progressText.textContent = "Starting search…";

      try {
        const params = new URLSearchParams({
          email: email,
          label_id: labelSelect.value || "",
          scope: scopeSelect.value,
          keywords: keywords,
          has_attachment: hasAttachment.checked ? "1" : "0"
        });
        const startRes = await fetch("{% url 'gmail_process_search_json' %}?" + params.toString(), {
          headers: { "X-Requested-With": "XMLHttpRequest" }
        });
        const startData = await startRes.json();
        if (!startRes.ok || !startData.ok) {
          throw new Error(startData.message || "Could not start search.");
        }
        const jobId = startData.job_id;

        let results = null;
        while (true) {
          const statusUrl = "{% url 'gmail_process_search_status_json' 'JOB_ID' %}".replace("JOB_ID", jobId);
          const statusRes = await fetch(statusUrl, { headers: { "X-Requested-With": "XMLHttpRequest" } });
          const statusData = await statusRes.json();
          if (!statusRes.ok || !statusData.ok) {
            throw new Error(statusData.message || "Search status check failed.");
          }

          const total = statusData.total || 0;
          const current = statusData.current || 0;
          const percent = total > 0 ? Math.round((current / total) * 100) : 0;
          progressBar.style.width = percent + "%";
          progressTrack.setAttribute("aria-valuenow", String(percent));
          progressText.textContent = statusData.message || "Working…";

          if (statusData.done) {
            if (statusData.error) {
              throw new Error(statusData.error);
            }
            results = statusData.results || [];
            break;
          }
          await new Promise(function (resolve) { window.setTimeout(resolve, 500); });
        }

        progressWrap.hidden = true;
        resultsWrap.hidden = false;
        if (!results.length) {
          resultsWrap.innerHTML = '<p class="muted">No matching emails found.</p>';
          return;
        }
        let html = '<h2 class="excel-import-report-heading">Matching emails (' + results.length + ')</h2>';
        html += '<button type="button" id="gp-download-btn" class="button button-compact">Download attachments</button>';
        html += '<div class="table-wrap"><table class="data-grid excel-import-match-table">';
        html += "<thead><tr><th>Subject</th><th>From</th><th>Date</th><th>Attachment</th></tr></thead><tbody>";
        results.forEach(function (r) {
          html += "<tr><td>" + escapeHtmlCell(r.subject) + "</td><td>" + escapeHtmlCell(r.from) +
            "</td><td>" + escapeHtmlCell(r.date) + "</td><td>" + (r.has_attachment ? "Yes" : "No") + "</td></tr>";
        });
        html += "</tbody></table></div>";
        resultsWrap.innerHTML = html;

        const downloadBtn = document.getElementById("gp-download-btn");
        if (downloadBtn) {
          downloadBtn.addEventListener("click", function () {
            downloadAttachments(email, results.map(function (r) { return r.id; }));
          });
        }
      } catch (e) {
        progressWrap.hidden = true;
        resultsWrap.hidden = false;
        resultsWrap.innerHTML = '<p class="field-error">' + escapeHtmlCell(e.message || "Search failed.") + "</p>";
      } finally {
        searchBtn.disabled = false;
      }
    });
    async function downloadAttachments(email, messageIds) {
      progressWrap.hidden = false;
      resultsWrap.hidden = true;
      progressBar.style.width = "0%";
      progressText.textContent = "Starting download…";

      try {
        const formData = new FormData();
        formData.append("email", email);
        formData.append("label_id", labelSelect.value || "");
        messageIds.forEach(function (id) { formData.append("message_id", id); });

        const startRes = await fetch("{% url 'gmail_process_download_json' %}", {

        const csrfToken = csrfMatch ? csrfMatch[1] : "";
        const startRes = await fetch("{% url 'gmail_process_download_json' %}", {
          method: "POST",
          body: formData,
          headers: {
            "X-Requested-With": "XMLHttpRequest",
            "X-CSRFToken": csrfToken
          }
        });
        const startData = await startRes.json();
        if (!startRes.ok || !startData.ok) {
          throw new Error(startData.message || "Could not start download.");
        }
        const jobId = startData.job_id;

        let result = null;
        while (true) {
          const statusUrl = "{% url 'gmail_process_search_status_json' 'JOB_ID' %}".replace("JOB_ID", jobId);
          const statusRes = await fetch(statusUrl, { headers: { "X-Requested-With": "XMLHttpRequest" } });
          const statusData = await statusRes.json();
          if (!statusRes.ok || !statusData.ok) {
            throw new Error(statusData.message || "Status check failed.");
          }

          const total = statusData.total || 0;
          const current = statusData.current || 0;
          const percent = total > 0 ? Math.round((current / total) * 100) : 0;
          progressBar.style.width = percent + "%";
          progressTrack.setAttribute("aria-valuenow", String(percent));
          progressText.textContent = statusData.message || "Working…";

          if (statusData.done) {
            if (statusData.error) {
              throw new Error(statusData.error);
            }
            result = statusData.results;
            break;
          }
          await new Promise(function (resolve) { window.setTimeout(resolve, 500); });
        }

        progressWrap.hidden = true;
        resultsWrap.hidden = false;
        resultsWrap.innerHTML = '<p class="muted">Downloaded ' + (result.downloaded_files || 0) +
          ' file(s) from ' + (result.messages_processed || 0) + ' email(s) into your Downloads/gmail_processor folder. ' +
          (result.messages_with_no_attachment || 0) + ' email(s) had no attachment. ' +
          'Moved ' + (result.moved || 0) + ' email(s) to the Processed label.</p>';

      } catch (e) {
        progressWrap.hidden = true;
        resultsWrap.hidden = false;
        resultsWrap.innerHTML = '<p class="field-error">' + escapeHtmlCell(e.message || "Download failed.") + "</p>";
      }
    }

    const moveToInboxBtn = document.getElementById("gp-move-to-inbox-btn");

    moveToInboxBtn.addEventListener("click", async function () {
      const email = accountSelect.value;
      if (!email) {
        alert("Choose an account first.");
        return;
      }
      if (!confirm("Move ALL mails (outside Inbox, excluding Spam/Trash) into Inbox for " + email + "?")) {
        return;
      }

      moveToInboxBtn.disabled = true;
      resultsWrap.hidden = true;
      progressWrap.hidden = false;
      progressBar.style.width = "0%";
      progressText.textContent = "Starting…";

      try {
        const csrfMatch = document.cookie.match(/csrftoken=([^;]+)/);
        const csrfToken = csrfMatch ? csrfMatch[1] : "";
        const formData = new FormData();
        formData.append("email", email);

        const startRes = await fetch("{% url 'gmail_process_move_to_inbox_json' %}", {
          method: "POST",
          body: formData,
          headers: {
            "X-Requested-With": "XMLHttpRequest",
            "X-CSRFToken": csrfToken
          }
        });
        const startData = await startRes.json();
        if (!startRes.ok || !startData.ok) {
          throw new Error(startData.message || "Could not start.");
        }
        const jobId = startData.job_id;

        let result = null;
        while (true) {
          const statusUrl = "{% url 'gmail_process_search_status_json' 'JOB_ID' %}".replace("JOB_ID", jobId);
          const statusRes = await fetch(statusUrl, { headers: { "X-Requested-With": "XMLHttpRequest" } });
          const statusData = await statusRes.json();
          if (!statusRes.ok || !statusData.ok) {
            throw new Error(statusData.message || "Status check failed.");
          }

          const total = statusData.total || 0;
          const current = statusData.current || 0;
          const percent = total > 0 ? Math.round((current / total) * 100) : 0;
          progressBar.style.width = percent + "%";
          progressTrack.setAttribute("aria-valuenow", String(percent));
          progressText.textContent = statusData.message || "Working…";

          if (statusData.done) {
            if (statusData.error) {
              throw new Error(statusData.error);
            }
            result = statusData.results;
            break;
          }
          await new Promise(function (resolve) { window.setTimeout(resolve, 500); });
        }

        progressWrap.hidden = true;
        resultsWrap.hidden = false;
        resultsWrap.innerHTML = '<p class="muted">Moved ' + (result.moved || 0) + ' of ' + (result.total || 0) + ' email(s) to Inbox.</p>';
      } catch (e) {
        progressWrap.hidden = true;
        resultsWrap.hidden = false;
        resultsWrap.innerHTML = '<p class="field-error">' + escapeHtmlCell(e.message || "Failed.") + "</p>";
      } finally {
        moveToInboxBtn.disabled = false;
      }
    });

    const uniqueSubjectsBtn = document.getElementById("gp-unique-subjects-btn");

    uniqueSubjectsBtn.addEventListener("click", async function () {
      const email = accountSelect.value;
      if (!email) {
        alert("Choose an account first.");
        return;
      }

      uniqueSubjectsBtn.disabled = true;
      resultsWrap.hidden = true;
      resultsWrap.innerHTML = "";
      progressWrap.hidden = false;
      progressBar.style.width = "0%";
      progressText.textContent = "Starting…";

      try {
        const params = new URLSearchParams({
          email: email,
          label_id: labelSelect.value || ""
        });
        const startRes = await fetch("{% url 'gmail_process_unique_subjects_json' %}?" + params.toString(), {
          headers: { "X-Requested-With": "XMLHttpRequest" }
        });
        const startData = await startRes.json();
        if (!startRes.ok || !startData.ok) {
          throw new Error(startData.message || "Could not start.");
        }
        const jobId = startData.job_id;

        let subjects = null;
        while (true) {
          const statusUrl = "{% url 'gmail_process_search_status_json' 'JOB_ID' %}".replace("JOB_ID", jobId);
          const statusRes = await fetch(statusUrl, { headers: { "X-Requested-With": "XMLHttpRequest" } });
          const statusData = await statusRes.json();
          if (!statusRes.ok || !statusData.ok) {
            throw new Error(statusData.message || "Status check failed.");
          }

          const total = statusData.total || 0;
          const current = statusData.current || 0;
          const percent = total > 0 ? Math.round((current / total) * 100) : 0;
          progressBar.style.width = percent + "%";
          progressTrack.setAttribute("aria-valuenow", String(percent));
          progressText.textContent = statusData.message || "Working…";

          if (statusData.done) {
            if (statusData.error) {
              throw new Error(statusData.error);
            }
            subjects = statusData.results || [];
            break;
          }
          await new Promise(function (resolve) { window.setTimeout(resolve, 500); });
        }

        progressWrap.hidden = true;
        resultsWrap.hidden = false;
        if (!subjects.length) {
          resultsWrap.innerHTML = '<p class="muted">No emails found in this label.</p>';
          return;
        }
        let html = '<h2 class="excel-import-report-heading">Unique subjects (' + subjects.length + ')</h2>';
        html += "<ul>";
        subjects.forEach(function (s) {
          html += "<li>" + escapeHtmlCell(s) + "</li>";
        });
        html += "</ul>";
        resultsWrap.innerHTML = html;
      } catch (e) {
        progressWrap.hidden = true;
        resultsWrap.hidden = false;
        resultsWrap.innerHTML = '<p class="field-error">' + escapeHtmlCell(e.message || "Failed.") + "</p>";
      } finally {
        uniqueSubjectsBtn.disabled = false;
      }
    });
  })();
</script>

{% endblock %}
